services:
  # Django Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dz-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_ENV=prod
      - DJANGO_SETTINGS_MODULE=core.settings
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,otec.ltd,www.otec.ltd,otec-au.com,www.otec-au.com}
      - RATELIMIT_ENABLE=${RATELIMIT_ENABLE:-False}
      - DB_NAME=${DB_NAME:-dz}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - BREVO_SMTP=${BREVO_SMTP:-smtp-relay.brevo.com}
      - BREVO_PORT=${BREVO_PORT:-587}
      - BREVO_LOGIN=${BREVO_LOGIN}
      - BREVO_PASSWORD=${BREVO_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-info@otec-au.com}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-info@otec-au.com}
    env_file:
      - .env
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dz-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: dz-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-dz}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dz}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis (optional - for caching, sessions, Celery)
  # Uncomment if you need Redis
  # redis:
  #   image: redis:7-alpine
  #   container_name: dz-redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - dz-network

volumes:
  postgres_data:
  media_data:
  logs_data:
  # redis_data:

networks:
  dz-network:
    driver: bridge
